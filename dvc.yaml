stages:
  prepare:
    cmd: python src/processing/processing.py
    deps:
    - data/raw/market_data.csv
    - src/processing/processing.py
    outs:
    - data/processed/cleaned_data.csv
  train:
    cmd: python src/training/train.py
    deps:
    - data/processed/cleaned_data.csv
    - src/training/train.py
